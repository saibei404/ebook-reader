<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨鱼阅读器</title>
    <!--
      内容安全策略（CSP）。
      - script-src 只允许 'self'：本项目没有内联脚本，收紧后即使有人往书里塞脚本也执行不了；
      - style-src 必须留 'unsafe-inline' + blob:：React 内联 style、兜底页的 <style>，
        以及 EPUB 章节的样式表——epub.js 把 xhtml/css 都作为 blob: URL 注入，
        不放行 blob: 会出现「文字在、样式全丢」（实测颜色从多色退化成 1 色）；
      - font-src 同理放行 blob:（EPUB 内嵌字体）；
      - img/media/connect 放行 moyu-file:（本地书籍协议）与 blob:/data:（封面、EPUB 内图片）；
      - frame-src 放行 blob:/data:：EPUB 的章节被 epub.js 装在 blob: iframe 里渲染；
      - object-src 'none'、base-uri 'none'、form-action 'none'：这三项在本应用里完全用不到，直接掐死。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: moyu-file:; font-src 'self' data: blob:; media-src 'self' blob: moyu-file:; connect-src 'self' data: blob: moyu-file:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
